{% extends 'generic/object.html' %}
{% load i18n %}
{% block extra_controls %}
  {% if request.user.is_superuser %}
    <form method="post" action="{% url 'plugins:netbox_proxmox:test_connection' pk=object.pk %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-secondary"><i class="mdi mdi-lan-connect"></i> {% trans "Test connection" %}</button>
    </form>
  {% endif %}
  {% if perms.netbox_proxmox.change_proxmoxobject %}
    <form method="post" action="{% url 'plugins:netbox_proxmox:sync_now' pk=object.pk %}">
      {% csrf_token %}
      <button type="submit" class="btn btn-primary"><i class="mdi mdi-sync"></i> {% trans "Sync now" %}</button>
    </form>
  {% endif %}
{% endblock %}

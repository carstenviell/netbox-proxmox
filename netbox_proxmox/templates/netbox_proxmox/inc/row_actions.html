{% load i18n %}
{% if perms.netbox_proxmox.change_proxmoxobject %}
  <div class="d-flex gap-1 justify-content-end">
    {% if not record.target and record.state != 'stale' %}
      <a href="{% url 'plugins:netbox_proxmox:assign' pk=record.pk %}?return_url={{ request.get_full_path|urlencode }}" class="btn btn-sm btn-primary">{% trans "Assign" %}</a>
    {% endif %}
    <a href="{% url 'plugins:netbox_proxmox:toggle_ignore' pk=record.pk %}?return_url={{ request.get_full_path|urlencode }}" class="btn btn-sm btn-outline-secondary">{% if record.ignored %}{% trans "Unignore" %}{% else %}{% trans "Ignore" %}{% endif %}</a>
  </div>
{% endif %}
